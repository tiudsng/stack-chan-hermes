name: Build Stack-chan Firmware

on:
  push:
    paths:
      - 'firmware/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/simulator/**'
      - '.github/actions/setup/action.yml'
      - '.github/workflows/build.yml'
      - 'lefthook.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/simulator/**'
      - '.github/actions/setup/action.yml'
      - '.github/workflows/build.yml'
      - 'lefthook.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32/m5stack
          - esp32/m5stack_cores3
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Build firmware
        working-directory: ./firmware
        run: source "$HOME/.local/share/xs-dev-export.sh" && npm run build --target=${{ matrix.target }}
      - name: Upload firmware
        if: matrix.target == 'esp32/m5stack_cores3'
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-firmware-cores3
          path: firmware/stackchan/
