name: Build Stack-chan Firmware

on:
  push:
    paths:
      - 'firmware/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/simulator/**'
      - '.github/actions/setup/action.yml'
      - '.github/workflows/build.yml'
      - 'lefthook.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - 'web/package.json'
      - 'web/package-lock.json'
      - 'web/simulator/**'
      - '.github/actions/setup/action.yml'
      - '.github/workflows/build.yml'
      - 'lefthook.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32/m5stack
          - esp32/m5stack_cores3
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build firmware
        working-directory: ./firmware
        run: source "$HOME/.local/share/xs-dev-export.sh" && npm run build --target=${{ matrix.target }}
      - name: Locate firmware binaries
        if: matrix.target == 'esp32/m5stack_cores3'
        run: |
          set -euo pipefail
          BUILD_DIR="$HOME/.local/share/moddable/build/bin/esp32/m5stack_cores3"
          echo "=== Build output dirs ==="
          ls -la "$BUILD_DIR/" 2>/dev/null || echo "no $BUILD_DIR"
          find "$BUILD_DIR" -maxdepth 3 -type d 2>/dev/null
          echo "=== All .bin and .elf files ==="
          find "$BUILD_DIR" -name "*.bin" -o -name "*.elf" 2>/dev/null
          mkdir -p /tmp/firmware-artifact
          find "$BUILD_DIR" -name "*.bin" -o -name "*.elf" 2>/dev/null | while read f; do
            cp "$f" /tmp/firmware-artifact/
          done
          ls -la /tmp/firmware-artifact/
      - name: Upload firmware
        if: matrix.target == 'esp32/m5stack_cores3'
        uses: actions/upload-artifact@v4
        with:
          name: stackchan-firmware-cores3
          path: /tmp/firmware-artifact/
